name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install uv
      - run: uv sync --locked --group dev
      - run: uv run python -m pytest service/tests -q
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: email-jev-labeller
          path: release/
