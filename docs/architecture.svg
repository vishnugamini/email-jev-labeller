<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770" role="img" aria-labelledby="title desc">
  <title id="title">Gmail classification flow</title>
  <desc id="desc">Visible Gmail content passes through a Chrome service worker to the local FastAPI service. The service reuses SQLite results or calls hosted Jev with a Choice question and three Noul action questions. Validated results, with corrections and rules applied, return to Gmail as badges and action cards.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#334155;font-size:15px}
      .heading{font-size:13px;font-weight:700;fill:#64748b;letter-spacing:1px}
      .name{font-size:18px;font-weight:700;fill:#0f172a}
      .note{font-size:13px;fill:#64748b}
      .edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1040" height="770" rx="16" fill="#fff"/>
  <rect x="24" y="20" width="992" height="174" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="48" class="heading">CHROME EXTENSION</text>
  <rect x="48" y="72" width="250" height="94" rx="8" class="box"/>
  <text x="66" y="100" class="name">Gmail content script</text>
  <text x="66" y="125">Sender, subject, preview</text>
  <text x="66" y="147" class="note">Opened thread → rendered bodies</text>
  <path d="M298 119H354" class="edge"/>
  <rect x="356" y="72" width="250" height="94" rx="8" class="box"/>
  <text x="374" y="100" class="name">Service worker</text>
  <text x="374" y="125">Local requests and pairing</text>
  <text x="374" y="147" class="note">No Jev key in the extension</text>
  <path d="M662 119H608" class="edge"/>
  <rect x="664" y="72" width="326" height="94" rx="8" class="box"/>
  <text x="682" y="100" class="name">Popup settings</text>
  <text x="682" y="125">Labels, descriptions, priorities</text>
  <text x="682" y="147" class="note">Sender rules and visibility switches</text>
  <rect x="24" y="250" width="640" height="326" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="280" class="heading">LOCAL PYTHON SERVICE</text>
  <rect x="48" y="302" width="230" height="170" rx="8" class="box"/>
  <text x="66" y="334" class="name">SQLite</text>
  <text x="66" y="365">Preferences and sender rules</text>
  <text x="66" y="391">Fingerprints and results</text>
  <text x="66" y="417">Conversation corrections</text>
  <text x="66" y="448" class="note">No email bodies or subjects</text>
  <path d="M280 385H328" class="edge" marker-start="url(#arrow)"/>
  <rect x="330" y="302" width="310" height="170" rx="8" class="box"/>
  <text x="348" y="334" class="name">FastAPI + classification engine</text>
  <text x="348" y="365">Check token and observation</text>
  <text x="348" y="391">Reuse cache or request Jev</text>
  <text x="348" y="417">Validate and cache answers</text>
  <text x="348" y="448" class="note">Apply corrections and sender rules</text>
  <text x="48" y="514" class="note">Cache key: conversation + content + preferences + model</text>
  <text x="48" y="540" class="note">Opened bodies upgrade previews; new content invalidates corrections.</text>
  <rect x="704" y="250" width="312" height="326" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="724" y="280" class="heading">HOSTED JEV API</text>
  <rect x="728" y="302" width="264" height="170" rx="8" class="box"/>
  <text x="746" y="334" class="name">jev-1.14.0</text>
  <text x="746" y="366">Choice → one label</text>
  <text x="746" y="395">Noul → To do</text>
  <text x="746" y="421">Noul → Has a deadline</text>
  <text x="746" y="447">Noul → Waiting</text>
  <path d="M640 350H726" class="edge"/>
  <text x="653" y="337" class="note">HTTPS</text>
  <path d="M728 428H642" class="edge"/>
  <text x="728" y="514" class="note">Email text and priorities</text>
  <text x="728" y="540" class="note">Label descriptions become criteria</text>
  <path d="M481 166V300" class="edge"/>
  <text x="496" y="222" class="note">HTTP · 127.0.0.1:8765</text>
  <path d="M620 472V594H481V646" class="edge"/>
  <text x="496" y="614" class="note">Validated results return through the worker</text>
  <rect x="24" y="648" width="992" height="98" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="676" class="name">Back in Gmail</text>
  <text x="44" y="704">Check the row still matches → apply visibility settings → show the label and action cards</text>
  <text x="44" y="728" class="note">Click a badge to inspect scores or correct the label. The mailbox stays unchanged.</text>
</svg>
